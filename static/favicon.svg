<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="url(#neonTeal)" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle glow aura in center -->
  <circle cx="32" cy="32" r="18" fill="#2dd4bf" opacity="0.12" filter="url(#glow)"/>

  <!-- Base -->
  <path d="M22 50 h20" stroke="url(#neonTeal)" stroke-width="3" stroke-linecap="round" />
  <!-- Pillar -->
  <path d="M32 50 V18" stroke="url(#neonTeal)" stroke-width="3" stroke-linecap="round" />
  <!-- Apex finial -->
  <circle cx="32" cy="16" r="3.5" fill="#2dd4bf" filter="url(#glow)"/>
  
  <!-- Crossbeam -->
  <path d="M14 24 Q32 20 50 24" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Left Pan Cords & Plate -->
  <path d="M16 25 L10 37 M16 25 L22 37" stroke="url(#neonPurple)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8 37 Q16 42 24 37 Z" fill="url(#neonPurple)" opacity="0.9"/>

  <!-- Right Pan Cords & Plate -->
  <path d="M48 25 L42 37 M48 25 L54 37" stroke="url(#neonTeal)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M40 37 Q48 42 56 37 Z" fill="url(#neonTeal)" opacity="0.9"/>
</svg>
